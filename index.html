<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Input</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input[type="text"] { width: 100%; padding: 0.5rem; margin: 1rem 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 1rem; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Submit Data</h2>
        <form id="inputForm">
            <!-- max length constraint strictly enforced in UI -->
            <input type="text" id="textInput" maxlength="20" placeholder="Enter up to 20 characters..." required>
            <button type="submit">Submit</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('inputForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const textInput = document.getElementById('textInput').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ textInput })
                });

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.innerText = 'Data saved successfully!';
                    document.getElementById('textInput').value = '';
                } else {
                    const errText = await response.text();
                    messageDiv.style.color = 'red';
                    messageDiv.innerText = `Error: ${errText}`;
                }
            } catch (err) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = 'Network error. Try again.';
            }
        });
    </script>
</body>
</html>
