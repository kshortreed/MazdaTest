<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Firestore Test App (V2)</title>
  <!-- Firebase SDKs automatically configured by Firebase Hosting -->
  <script defer src="/__/firebase/10.8.0/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/10.8.0/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/init.js"></script>
</head>
<body>
  <h2>Submit Text to Firestore</h2>
  <form id="inputForm">
    <input type="text" id="userInput" placeholder="Type something..." required>
    <button type="submit">Submit</button>
  </form>
  <p id="status"></p>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize Firestore using the automatic configuration
      const db = firebase.firestore();
      const form = document.getElementById('inputForm');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const textValue = document.getElementById('userInput').value;
        status.textContent = "Saving...";

        try {
          // Store the text input inside a collection called "testInputs"
          await db.collection("testInputs").add({
            text: textValue,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          status.textContent = "Success! Saved to Firestore.";
          form.reset();
        } catch (error) {
          status.textContent = "Error: " + error.message;
        }
      });
    });
  </script>
</body>
</html>
